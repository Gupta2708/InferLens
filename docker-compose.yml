name: inferlens

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${INFERLENS_POSTGRES_DB:-inferlens}
      POSTGRES_USER: ${INFERLENS_POSTGRES_USER:-inferlens}
      POSTGRES_PASSWORD: ${INFERLENS_POSTGRES_PASSWORD:-inferlens}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INFERLENS_POSTGRES_USER:-inferlens} -d ${INFERLENS_POSTGRES_DB:-inferlens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: inferlens-api:latest
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      DATABASE_URL: postgresql+psycopg://${INFERLENS_POSTGRES_USER:-inferlens}:${INFERLENS_POSTGRES_PASSWORD:-inferlens}@postgres:5432/${INFERLENS_POSTGRES_DB:-inferlens}
      REDIS_URL: redis://redis:6379/0
      LLM_MOCK_MODE: ${LLM_MOCK_MODE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-mock}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-mock-fast}
      DEFAULT_CONTEXT_WINDOW: ${DEFAULT_CONTEXT_WINDOW:-8}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-30}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-1}
      PROVIDER_FALLBACKS: ${PROVIDER_FALLBACKS:-\{\}}
      CONTENT_CAPTURE_ENABLED: ${CONTENT_CAPTURE_ENABLED:-false}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      EXTERNAL_TRACE_URL_TEMPLATE: ${EXTERNAL_TRACE_URL_TEMPLATE:-}
      PORT: ${API_PORT:-8000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: inferlens-worker:latest
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${INFERLENS_POSTGRES_USER:-inferlens}:${INFERLENS_POSTGRES_PASSWORD:-inferlens}@postgres:5432/${INFERLENS_POSTGRES_DB:-inferlens}
      REDIS_URL: redis://redis:6379/0
      LLM_MOCK_MODE: ${LLM_MOCK_MODE:-false}
      DEFAULT_CONTEXT_WINDOW: ${DEFAULT_CONTEXT_WINDOW:-8}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_RETRY_LIMIT: ${WORKER_RETRY_LIMIT:-3}
      WORKER_STALE_CLAIM_MS: ${WORKER_STALE_CLAIM_MS:-60000}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.workers.ingestion_worker

  web:
    image: inferlens-web:latest
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
